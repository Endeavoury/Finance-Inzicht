server { listen 8080; server_name _; root /usr/share/nginx/html; index index.html; client_max_body_size 2g; client_body_timeout 30m; proxy_read_timeout 30m; proxy_send_timeout 30m; location = /health { access_log off; add_header Content-Type text/plain; return 200 'ok'; } location = /index.html { add_header Cache-Control 'no-cache, no-store, must-revalidate'; try_files $uri =404; } location ~* \.(?:js|css|woff2?|png|svg|webp)$ { expires 1y; add_header Cache-Control 'public, immutable'; try_files $uri =404; } location /api/ { proxy_pass http://api:8080; proxy_set_header X-Correlation-ID $request_id; } location / { try_files $uri $uri/ /index.html; } }
