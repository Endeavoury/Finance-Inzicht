name: Build and publish Oikonomis containers

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  repository_dispatch:
    types: [semantic-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.event.client_payload.version || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  KANOSIS_REF: d49785536eb57735f1b7869631be6e51c051744f
  RELEASE_REF: ${{ github.event.client_payload.tag || github.ref }}

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Check out design system
        run: |
          git init ../design
          git -C ../design remote add origin https://github.com/Endeavoury/Finance-DesignSystem.git
          git -C ../design fetch --depth 1 origin "$KANOSIS_REF"
          git -C ../design checkout --detach FETCH_HEAD

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and test .NET
        run: dotnet test Oikonomis.slnx --configuration Release

      - name: Set up Node.js 26.5.0
        uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: src/Web/package-lock.json

      - name: Build design-system packages
        working-directory: ../design
        run: |
          npm ci
          npm run build:packages

      - name: Build web application
        working-directory: src/Web
        run: |
          npm ci
          npm run build

  publish:
    name: Build ${{ matrix.component }} image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: src/Api/Dockerfile
          - component: worker
            dockerfile: src/Worker/Dockerfile
          - component: web
            dockerfile: src/Web/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/endeavoury/oikonomis-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ github.event.client_payload.version }},enable=${{ github.event_name == 'repository_dispatch' }}
            type=raw,value=${{ github.event.client_payload.major_minor }},enable=${{ github.event_name == 'repository_dispatch' }}
            type=raw,value=${{ github.event.client_payload.major }},enable=${{ github.event_name == 'repository_dispatch' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true
